prompt = """
ichunked(..., 0) raises islice's ValueError on a nonempty iterable

`ichunked` is documented as being like `chunked`, but with lazy chunks. `chunked` treats `n=0` as "yield nothing".
`ichunked` only does that when the source is already empty; with any remaining items it blows up:

```python
from more_itertools import chunked, ichunked

rows = ["a", "b", "c"]
print(list(chunked(rows, 0)))
# []
print([list(c) for c in ichunked(rows, 0)])
# ValueError: Stop argument for islice() must be None or an integer: 0 <= x <= sys.maxsize.
```

Negative `n` has the same leak: `chunked` raises `ValueError: n must be at least 0`, while `ichunked` raises
islice's "Indices for islice() must be None or an integer..." message.

Fix it. Run any tests you write yourself, then stop.
"""
