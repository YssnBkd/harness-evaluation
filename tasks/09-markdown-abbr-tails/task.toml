Empty abbreviation definitions are not ignored after an inline element

With the abbr extension, an empty glossary definition is ignored when the abbreviation occurs in an element's text.
After an inline element, the same abbreviation is wrapped in an empty-title `<abbr>` element:

```python
import markdown
from markdown.extensions.abbr import AbbrExtension

markdown.markdown('*word* HTML', extensions=[AbbrExtension(glossary={'HTML': ''})])
